name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, 'format:check', audit]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: matrix.check != 'audit'
        run: bun run ${{ matrix.check }}
      - if: matrix.check == 'audit'
        run: bun audit

  images:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: Dockerfile
            port: 9991
            path: /api/health/live
          - service: webhook
            dockerfile: webhook-forwarder/Dockerfile
            port: 3003
            path: /
          - service: pipelines
            dockerfile: pipelines/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull -f '${{ matrix.dockerfile }}' -t shipwrecked-test .
      - name: Smoke test HTTP
        if: matrix.service != 'pipelines'
        env:
          PORT: ${{ matrix.port }}
          HEALTH_PATH: ${{ matrix.path }}
        run: |
          docker run -d --name smoke -p "127.0.0.1:$PORT:$PORT" shipwrecked-test
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors "http://127.0.0.1:$PORT$HEALTH_PATH"
      - name: Audit Python dependencies
        if: matrix.service == 'pipelines'
        run: |
          docker run --rm --entrypoint /bin/sh shipwrecked-test -c \
            '/opt/venv/bin/pip install --no-cache-dir pip-audit && /opt/venv/bin/pip-audit -r /tmp/requirements.txt'

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shipwrecked_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/shipwrecked_test
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/shipwrecked_test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Prepare disposable test schema
        run: bun --bun prisma db push
      - run: bun test
